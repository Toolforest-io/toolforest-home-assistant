name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: python -m pip install -r requirements-test.txt
      - run: ruff check custom_components tests scripts
      - run: python -m pytest -q
      - run: python scripts/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: toolforest-home-assistant
          path: dist/toolforest.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check release version and package
        run: python scripts/package.py --version "${GITHUB_REF_NAME#v}"
      - name: Prepare draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/toolforest.zip --verify-tag --generate-notes --draft --title "Home Assistant toolkit $GITHUB_REF_NAME"
